<div class="subscribe-box">
  <div class="subscribe-text">
    <strong>📬 Bài mới qua email</strong>
    <span>Mỗi tuần 1 bài về ERP, BA, SCM. Không spam.</span>
  </div>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/uc_quan"
    method="post"
    target="popupwindow"
    onsubmit="window.open('https://buttondown.com/uc_quan', 'popupwindow')"
    class="subscribe-form"
  >
    <input
      type="email"
      name="email"
      placeholder="Email của bạn..."
      required
      class="subscribe-input"
    />
    <input type="hidden" name="embed" value="1" />
    <button type="submit" class="subscribe-btn">Đăng ký</button>
  </form>
</div>
